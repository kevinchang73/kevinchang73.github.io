<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: rgb(253, 181, 21); /*linear-gradient(135deg, #ff6f61, #de1f1f);*/
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.4rem;
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgb(0, 50, 98); /*#fff;*/
            color: #fff;/* #de1f1f;*/
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: background 0.3s, color 0.3s;
        }
        a:hover {
            background: rgb(253, 181, 21); /*#de1f1f;*/
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Oops! The page you are looking for does not exist.</p>
        <p id="redirect-message">You will be redirected to the homepage in <span id="countdown">5</span> seconds.</p>
        <a href="https://kevinchang73.github.io/">Go to Homepage Now</a>
    </div>
    <script>
        let countdownElement = document.getElementById('countdown');
        let countdownValue = 5;

        function updateCountdown() {
            if (countdownValue > 1) {
                countdownValue--;
                countdownElement.textContent = countdownValue;
            } else {
                window.location.href = 'https://kevinchang73.github.io/';
            }
        }

        setInterval(updateCountdown, 1000); // Update countdown every second
    </script>
</body>
</html>
